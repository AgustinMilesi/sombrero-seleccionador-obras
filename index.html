<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎩</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0c0d12" />
    <title>El Sombrero Seleccionador | Instituto Obras</title>
    
    <!-- Ultra-fast Google Fonts Preconnect and Asynchronous Swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@400;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    </noscript>

    <style>
      /* Instant Critical Inline Styles */
      body {
        margin: 0;
        background-color: #0c0d12;
        color: #fef3c7;
        font-family: 'Cinzel', Georgia, serif;
        overflow-x: hidden;
      }
      @keyframes floatHat {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes shimmerBar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(0.95); }
        50% { opacity: 0.9; transform: scale(1.08); }
      }
      .preloader-wrap {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        position: relative;
        background: radial-gradient(circle at 50% 40%, #1a1510 0%, #0c0d12 75%);
      }
      .preloader-hat {
        font-size: 64px;
        line-height: 1;
        animation: floatHat 2s ease-in-out infinite;
        filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.45));
        margin-bottom: 16px;
      }
      .preloader-title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 3px;
        color: #f59e0b;
        text-transform: uppercase;
        margin: 0 0 6px 0;
        text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      }
      .preloader-sub {
        font-size: 13px;
        letter-spacing: 2px;
        color: #d1d5db;
        text-transform: uppercase;
        margin: 0 0 24px 0;
        opacity: 0.85;
      }
      .preloader-bar-bg {
        width: 160px;
        height: 4px;
        background: rgba(245, 158, 11, 0.2);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }
      .preloader-bar-fill {
        width: 60%;
        height: 100%;
        background: linear-gradient(90deg, #d97706, #fbbf24, #f59e0b);
        border-radius: 99px;
        animation: shimmerBar 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }
      .preloader-hint {
        font-size: 11px;
        letter-spacing: 1px;
        color: #9ca3af;
        margin-top: 14px;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#0c0d12] text-amber-50 min-h-screen selection:bg-amber-500 selection:text-black">
    <div id="root">
      <!-- Instant Preloader Rendered in <10ms before JS bundles execute -->
      <div class="preloader-wrap">
        <div class="preloader-hat">🎩</div>
        <h1 class="preloader-title">El Sombrero Seleccionador</h1>
        <p class="preloader-sub">Instituto Obras Sanitarias</p>
        <div class="preloader-bar-bg">
          <div class="preloader-bar-fill"></div>
        </div>
        <div class="preloader-hint">Invocando la magia del Gran Comedor...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
